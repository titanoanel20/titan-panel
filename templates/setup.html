<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05050f">
  <title>راه‌اندازی — TiTaN</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/emblem.svg">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="grid-floor"></div>
  </div>

  <main class="login-layout">
    <section class="login-panel" aria-label="راه‌اندازی اولیه پنل TiTaN">
      <div class="card">
        <div class="panel-emblem" aria-hidden="true"><img src="/static/img/emblem.svg" alt=""></div>

        <header class="card-head">
          <img class="emblem" src="/static/img/emblem.svg" alt="نشان TiTaN" width="58" height="58">
          <h1 class="brand">TiTaN</h1>
        </header>

        <h2 class="welcome">راه‌اندازی اولیه</h2>
        <p class="welcome-sub">اولین بار است که وارد می‌شوید — حساب مدیر را بسازید</p>

        <form id="setupForm" novalidate>
          <div class="field">
            <label class="field-label" for="username">نام کاربری</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
                </svg>
              </span>
              <input class="input" id="username" name="username" type="text"
                     placeholder="نام کاربری" autocomplete="username"
                     autocapitalize="none" spellcheck="false"
                     required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+">
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">رمز عبور</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                </svg>
              </span>
              <input class="input has-toggle" id="password" name="password" type="password"
                     placeholder="رمز عبور (حداقل ۶ کاراکتر)" autocomplete="new-password" required minlength="6">
              <button type="button" class="toggle-pass" id="togglePass" aria-label="نمایش رمز عبور" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
                  <path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.8"/><path d="M6.6 6.6A18 18 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4-1"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="confirm">تکرار رمز عبور</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                </svg>
              </span>
              <input class="input" id="confirm" name="confirm" type="password"
                     placeholder="تکرار رمز عبور" autocomplete="new-password" required>
            </div>
          </div>

          <div class="form-error" id="formError" role="alert" aria-live="polite"></div>

          <button class="btn-login" id="setupBtn" type="submit">
            <span class="btn-label">ایجاد مدیر</span>
            <span class="btn-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <footer class="card-footer">TiTaN © 2024 | تمامی حقوق محفوظ است</footer>
      </div>
    </section>

    <section class="visual" aria-hidden="true">
      <div class="halo"></div>
      <div class="cube-float">
        <div class="cube-stage">
          <div class="cube-spin">
            <div class="cube">
              <span class="face face-front"></span>
              <span class="face face-back"></span>
              <span class="face face-right"></span>
              <span class="face face-left"></span>
              <span class="face face-top"></span>
              <span class="face face-bottom"></span>
              <span class="cube-core"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="platform"></div>
      <div class="cube-reflection"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('setupForm');
    const errEl = document.getElementById('formError');
    const btn = document.getElementById('setupBtn');
    const showErr = (m) => { errEl.textContent = m; errEl.classList.add('visible'); };
    const hideErr = () => { errEl.textContent = ''; errEl.classList.remove('visible'); };

    document.getElementById('togglePass').addEventListener('click', function () {
      const p = document.getElementById('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      this.setAttribute('aria-pressed', String(show));
      this.querySelector('.eye-open').hidden = show;
      this.querySelector('.eye-off').hidden = !show;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideErr();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) return showErr('رمز عبور و تکرار آن یکسان نیستند');
      if (password.length < 6) return showErr('رمز عبور باید حداقل ۶ کاراکتر باشد');

      btn.classList.add('loading');
      btn.disabled = true;
      try {
        const r = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (r.ok) { location.href = '/dashboard'; return; }
        const d = await r.json().catch(() => ({}));
        showErr(d.detail || 'خطا در ایجاد حساب');
      } catch (_) {
        showErr('خطا در ارتباط با سرور');
      }
      btn.classList.remove('loading');
      btn.disabled = false;
    });
  </script>
</body>
</html>
